<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/icon.jpg" type="image/jpg" />
    <link rel="stylesheet" href="css/results.css">
    <style>
        
        .table th,
        .table td {
        vertical-align: middle;
        }

    </style>

</head>
<body>
    <div class="app-container">
        <!-- Overlay for Mobile -->
        <div class="overlay"></div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="and-icn">
                    <img src="img/icon.jpg" class="brand-icon">
                </div>
                <div class="brand"><i class="fa-solid fa-star"></i> software</div>
                <div class="school-name" id="schoolNameDisplay"></div>
            </div>
            
            <div class="greeting">
                <h5 id="timeGreeting">Good Morning, Admin!</h5>
                <small class="text-mute" id="currentDate">Monday, June 10, 2023</small>
            </div>
            
            <div class="nav-links" id="navContainer">
                
            </div>
        </div>
        
        <!-- Main Content -->
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="menu-btn">
                    <i class="fas fa-bars"></i>
                </button>

                <div class="header-right">
                    <div class="user-dropdown">
                        <button class="user-btn">
                            <img src="" id="profilePic" class="user-avatar"></img>
                            <i class="fas fa-chevron-down"></i>
                        </button>

                        <div class="dropdown-menu">
                            <a href="#" class="dropdown-item">
                                <i class="fas fa-bell"></i>
                                <span>Notifications</span>
                            </a>
                            <a href="#" id="ChangePassword" class="dropdown-item">
                                <i class="fas fa-lock"></i>
                                <span>Change Password</span>
                            </a>
                            <a href="#" class="dropdown-item">
                                <i class="fas fa-moon"></i>
                                <span>Dark Mode</span>
                                <div class="dark-mode-toggle" id="darkModeToggle">
                                    <div class="toggle-circle"></div>
                                </div>
                            </a>
                            <a href="#" id="logoutUser" class="dropdown-item">
                                <i class="fas fa-sign-out-alt"></i>
                                <span>Logout</span>
                            </a>
                        </div>
                    </div>
                </div>
            </header>
            <div class="page-content">
            <h4 class="fw-bold  mb-4" id="subscriptionHistory">Manage Fees</h4>
                <div class="d-flex justify-content-between align-items-center flex-wrap mb-3">
                    <input
                        type="text"
                        class="form-control form-control-sm w-auto"
                        placeholder="Search student..."
                        id="searchInput" />
                    </div>
                    <div class="card">
                    <div class="table-responsive">
                    <table id="studentsTable" class="table table-hover align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Other Info</th>
                            <th>Class</th>
                            <th class="text-center">Actions</th>
                        </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    </div>

                    </div>
                    
                <div class="d-flex justify-content-center gap-3 mt-3">
                <button id="prevBtn" class="btn btn-primary" disabled>
                    <span id="prevSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    <i class="fas fa-arrow-left"></i> Prev
                </button>
                <button id="nextBtn" class="btn btn-primary" disabled>
                    <span id="nextSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    Next <i class="fas fa-arrow-right"></i>
                </button>
                </div>

                        </div>
                    </div>
                </div>


            <footer class="footer">
                <div class="container">
                    <span>&copy; 2023 School Management System | All rights reserved</span>
                </div>
            </footer>

            <div class="custom-alert" id="customAlert">
        <div class="alert-progress" id="alertProgress"></div>
        <span class="alert-content" id="alertContent"></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script src="js/main.js"></script>
    <script src="js/fees.js"></script>
    <script>
        
    </script>
</body>
</html>
